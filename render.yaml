services:
  - type: web
    name: coolman-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_DATABASE
        value: coolman
      - key: FRONTEND_ORIGIN
        value: http://localhost:8080,http://localhost:5173,http://localhost:5174
